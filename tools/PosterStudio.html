<body>
<div id="app" class="app-root">
<!-- ======================================================================================== TOP TOOLBAR =========================================================================== -->
  <header class="toolbar" data-testid="top-toolbar">
    <div class="toolbar-left">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Poster<em>Studio</em></span>
      </div>
      <!-- Grouped for easier mobile hiding -->
      <div class="desktop-actions" id="desktop-actions">
        <button type="button" class="btn btn-ghost" id="btn-new" data-testid="btn-new" title="New project">New</button>
        <button type="button" class="btn btn-ghost" id="btn-open" data-testid="btn-open" title="Import JSON project">Open</button>
        <button type="button" class="btn btn-ghost" id="btn-save-json" data-testid="btn-save-json" title="Export project JSON">Save</button>
      </div>
      <input type="file" id="file-open" accept="application/json" hidden />
    </div>

    <div class="toolbar-center" id="toolbar-center">
      <button type="button" class="icon-btn" id="btn-undo" data-testid="btn-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-redo" data-testid="btn-redo" title="Redo (Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <div class="divider"></div>
      
      <select id="canvas-size" class="select" data-testid="canvas-size" aria-label="Canvas Size">
        <option value="a4-p">A4 Portrait</option>
        <option value="square" selected>Square 1080×1080</option>
        <option value="ig-post">Instagram Post</option>
        <option value="ig-story">Instagram Story</option>
        <option value="yt-thumb">YouTube Thumbnail</option>
        <option value="custom">Custom…</option>
      </select>

      <div class="zoom-group">
        <button type="button" class="icon-btn" id="btn-zoom-out" data-testid="btn-zoom-out" title="Zoom out">−</button>
        <span id="zoom-level" data-testid="zoom-level">50%</span>
        <button type="button" class="icon-btn" id="btn-zoom-in" data-testid="btn-zoom-in" title="Zoom in">+</button>
        <button type="button" class="icon-btn" id="btn-zoom-fit" data-testid="btn-zoom-fit" title="Fit to screen">⤢</button>
      </div>
    </div>

    <div class="toolbar-right">
      <button type="button" class="icon-btn" id="btn-theme" data-testid="btn-theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="export-menu">
        <button type="button" class="btn btn-primary" id="btn-export" data-testid="btn-export">Download</button>
        <div class="dropdown" id="export-dropdown">
          <button type="button" data-format="png">PNG</button>
          <button type="button" data-format="jpeg">JPEG</button>
          <button type="button" data-format="svg">SVG</button>
        </div>
      </div>
      <!-- NEW: Mobile Hamburger Button -->
      <button type="button" class="icon-btn mobile-only" id="btn-mobile-menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ MAIN GRID ============ -->
  <main class="main-grid">
    <!-- LEFT SIDEBAR / BOTTOM RAIL ON MOBILE -->
    <aside class="sidebar" data-testid="left-sidebar">
      <nav class="rail" role="tablist">
        <button type="button" class="rail-btn active" role="tab" data-panel="templates"><span>✦</span>Templates</button>
        <button type="button" class="rail-btn" role="tab" data-panel="text"><span>T</span>Text</button>
        <button type="button" class="rail-btn" role="tab" data-panel="shapes"><span>▲</span>Shapes</button>
        <button type="button" class="rail-btn" role="tab" data-panel="photos"><span>◨</span>Photos</button>
        <button type="button" class="rail-btn" role="tab" data-panel="upload"><span>↑</span>Upload</button>
        <button type="button" class="rail-btn" role="tab" data-panel="backgrounds"><span>▦</span>BG</button>
        <button type="button" class="rail-btn" role="tab" data-panel="layers"><span>≡</span>Layers</button>
      </nav>

      <section class="rail-panel" id="rail-panel" data-testid="rail-panel">
        <!-- Dynamic content injected here -->
      </section>
    </aside>

    <!-- CENTER: CANVAS -->
    <section class="editor" id="editor-area">
      <div class="editor-viewport" id="viewport">
        <div class="canvas-wrap" id="canvas-wrap">
          <div class="canvas" id="canvas" tabindex="0">
            <!-- elements rendered here -->
          </div>
          <div class="selection-overlay" id="selection-overlay"></div>
        </div>
      </div>
    </section>

    <!-- RIGHT: PROPERTIES / BOTTOM SHEET ON MOBILE -->
    <aside class="properties" id="properties-panel">
      <div class="properties-header">
        <h3 id="prop-title">Properties</h3>
        <span class="hint" id="prop-hint">Select an element</span>
      </div>
      <div class="properties-body" id="properties-body">
        <!-- Injected by properties.js -->
      </div>
    </aside>
  </main>

  <footer class="status-bar" data-testid="status-bar">
    <div class="status-left">
      <span id="status-elements">0 elements</span>
      <span class="dot"></span>
      <span id="status-canvas-size">1080 × 1080 px</span>
    </div>
  </footer>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="../assets/posterStudio/js/app.js"></script>
</body>
