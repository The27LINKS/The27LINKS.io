<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certificate Verification | The27LINKS</title>
  <meta name="description" content="Verify The27LINKS certificates securely." />

  <!-- Security Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://the27links.in; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --verify-bg: #f8fafc;
      --verify-card: rgba(255, 255, 255, 0.95);
      --verify-text: #0f172a;
      --verify-muted: #64748b;
      --verify-border: rgba(226, 232, 240, 0.8);
      --verify-accent: #0f172a;
      --verify-success: #10b981;
      --verify-error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Geist', sans-serif;
      background-color: var(--verify-bg);
      color: var(--verify-text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.04), transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.02), transparent 50%);
      animation: ambientShift 20s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes ambientShift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(2%, 2%) scale(1.05); }
    }

    header {
      padding: 32px; text-align: center; background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--verify-border);
    }
    
    main {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px;
    }

    .verify-card {
      background: var(--verify-card); backdrop-filter: blur(20px);
      border: 1px solid var(--verify-border); border-radius: 24px;
      padding: 48px 40px; width: 100%; max-width: 680px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08); text-align: center;
      display: none; opacity: 0; transform: translateY(20px) scale(0.98);
      transition: all 0.5s ease;
    }

    .verify-card.active { display: block; opacity: 1; transform: translateY(0) scale(1); }

    .verify-card h2 { font-size: 26px; font-weight: 600; margin-bottom: 12px; }
    .verify-card p.subtitle { color: var(--verify-muted); margin-bottom: 36px; font-size: 15px; }

    /* Animated Icons */
    .spinner {
      width: 56px; height: 56px; margin: 0 auto 28px;
      border: 3px solid rgba(15, 23, 42, 0.1); border-left-color: var(--verify-accent);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .icon-svg { width: 72px; height: 72px; margin: 0 auto 24px; display: block; }
    .icon-svg circle { stroke-width: 2.5; fill: none; stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawCircle 0.6s ease forwards; }
    .icon-svg path { stroke-width: 2.5; fill: none; stroke-dasharray: 50; stroke-dashoffset: 50; animation: drawPath 0.4s ease 0.4s forwards; }
    .success-svg { stroke: var(--verify-success); }
    .error-svg { stroke: var(--verify-error); }

    @keyframes drawCircle { to { stroke-dashoffset: 0; } }
    @keyframes drawPath { to { stroke-dashoffset: 0; } }

    /* Grid */
    .details-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
      text-align: left; background: #fff; padding: 32px; border-radius: 16px;
      border: 1px solid var(--verify-border);
    }
    
    .detail-item dt { font-size: 11px; text-transform: uppercase; color: var(--verify-muted); margin-bottom: 6px; font-weight: 600; }
    .detail-item dd { font-size: 15px; font-weight: 500; color: var(--verify-text); word-break: break-word; }

    .btn {
      display: inline-block; padding: 14px 32px; background: var(--verify-text);
      color: #fff; text-decoration: none; border-radius: 10px; font-weight: 500;
      margin-top: 12px; transition: background 0.2s;
    }
    .btn:hover { background: #334155; }

    @media (max-width: 600px) {
      .details-grid { grid-template-columns: 1fr; }
      .verify-card { padding: 40px 24px; }
    }
  </style>
</head>

<body>

  <header>
    <h1>The27LINKS Verification</h1>
  </header>

  <main>
    <!-- STATE: LOADING -->
    <div id="state-loading" class="verify-card active">
      <div class="spinner"></div>
      <h2>Authenticating Record...</h2>
      <p class="subtitle">Securely fetching and decrypting external records.</p>
    </div>

    <!-- STATE: SUCCESS -->
    <div id="state-success" class="verify-card">
      <svg class="icon-svg success-svg" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" />
        <path d="M14 24l7 7 14-14" />
      </svg>
      <h2>Certificate Verified</h2>
      <p class="subtitle" style="color: var(--verify-success);">This digital record is authentic and valid.</p>
      <dl id="certificate-details" class="details-grid"></dl>
    </div>

    <!-- STATE: ERROR -->
    <div id="state-error" class="verify-card">
      <svg class="icon-svg error-svg" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" />
        <path d="M16 16l16 16M32 16L16 32" />
      </svg>
      <h2 id="error-title">Record Not Found</h2>
      <p class="subtitle" id="error-message"></p>
      <a href="mailto:support@the27links.in" class="btn">Contact Support</a>
    </div>
  </main>

  <script>
    "use strict";

    const DATABASE_URL = "https://the27links.in/assets/Data/certificatesData.json";
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function fromBase64(value) {
      try {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      } catch (e) {
        throw new Error("INVALID_BASE64");
      }
    }

    async function deriveKey(passphrase, salt, iterations) {
      const material = await crypto.subtle.importKey(
        "raw", encoder.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: iterations, hash: "SHA-256" },
        material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }

    async function decryptCertificate(record, config, passphrase) {
      const salt = fromBase64(record.salt);
      const iv = fromBase64(record.iv);
      const ciphertext = fromBase64(record.ciphertext);
      const key = await deriveKey(passphrase, salt, config.iterations);
      
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv }, key, ciphertext
      );
      return JSON.parse(decoder.decode(plaintext));
    }

    function switchState(stateId) {
      document.querySelectorAll('.verify-card').forEach(el => el.classList.remove('active'));
      setTimeout(() => document.getElementById(stateId).classList.add('active'), 50);
    }

    function showError(title, msg) {
      document.getElementById("error-title").textContent = title;
      document.getElementById("error-message").textContent = msg;
      switchState('state-error');
    }

    function displayData(data) {
      // Mapping all updated custom parameters
      const fields = [
        ["Full Name", data.d1], 
        ["Certificate No.", data.d2],
        ["Role / Designation", data.d3], 
        ["Time Period", data.d4],
        ["Age Group", data.d5], 
        ["Department", data.d6],
        ["Overall Performance", data.d7], 
        ["Issue Date", data.d8],
        ["Authorized By", data.d9]
      ];

      const container = document.getElementById("certificate-details");
      container.innerHTML = "";

      fields.forEach(([label, value]) => {
        if (value) {
          const dt = document.createElement("dt"); dt.textContent = label;
          const dd = document.createElement("dd"); dd.textContent = value;
          const div = document.createElement("div"); div.className = "detail-item";
          div.appendChild(dt); div.appendChild(dd);
          container.appendChild(div);
        }
      });
      switchState('state-success');
    }

    async function initializeVerification() {
      const params = new URLSearchParams(window.location.search);
      let certificateKey = params.get("certificateNo");

      if (!certificateKey || certificateKey.trim() === "") {
        return showError("Invalid Request", "No certificate number found in URL.");
      }
      
      certificateKey = certificateKey.trim();

      try {
        const response = await fetch(DATABASE_URL + "?t=" + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error("FILE_NOT_FOUND");
        
        const db = await response.json();
        if (!db || !db.config || !Array.isArray(db.records)) {
          throw new Error("SCHEMA_ERROR");
        }

        let matchedRecord = null;

        for (const record of db.records) {
          try {
            const data = await decryptCertificate(record, db.config, certificateKey);
            if (String(data.d2) === certificateKey) {
              matchedRecord = data;
              break; 
            }
          } catch (e) {
            continue; 
          }
        }

        if (matchedRecord) {
          displayData(matchedRecord);
        } else {
          showError("Record Not Found", `No valid record matching ID "${certificateKey}".`);
        }

      } catch (error) {
        if (error.message === "FILE_NOT_FOUND") {
          showError("Database Missing", "The external certificatesData.json file could not be reached.");
        } else {
          showError("System Error", "An error occurred while connecting to the verification database.");
        }
      }
    }

    document.addEventListener("DOMContentLoaded", initializeVerification);
  </script>
</body>
</html>
