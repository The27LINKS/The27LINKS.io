<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certificate Verification | The27LINKS</title>
  <meta name="description" content="Verify The27LINKS certificates securely." />

  <!-- Strict Security & Anti-Cache Headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://the27links.in; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    /* ISOLATED COMPONENT SCOPE */
    :root {
      --iv-bg: #f8fafc;
      --iv-card: #ffffff;
      --iv-text: #0f172a;
      --iv-muted: #64748b;
      --iv-border: #e2e8f0;
      --iv-success: #10b981;
      --iv-error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Geist', sans-serif;
      background-color: var(--iv-bg);
      color: var(--iv-text);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Isolated Backdrop */
    body::before {
      content: "";
      position: fixed;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.03), transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.02), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ISOLATED CONTAINER WIDGET */
    .iv-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 20px;
    }

    .iv-card {
      background: var(--iv-card);
      border: 1px solid var(--iv-border);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.06);
      text-align: center;
      display: none;
      opacity: 0;
      transform: translateY(16px) scale(0.99);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .iv-card.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .iv-card h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .iv-card p.iv-subtitle {
      color: var(--iv-muted);
      margin-bottom: 32px;
      font-size: 15px;
      line-height: 1.5;
    }

    /* Spinner */
    .iv-spinner {
      width: 48px; height: 48px; margin: 0 auto 24px;
      border: 3px solid rgba(15, 23, 42, 0.08);
      border-left-color: var(--iv-text);
      border-radius: 50%;
      animation: ivSpin 0.8s linear infinite;
    }
    @keyframes ivSpin { 100% { transform: rotate(360deg); } }

    /* SVG Icons */
    .iv-svg { width: 64px; height: 64px; margin: 0 auto 20px; display: block; }
    .iv-svg circle { stroke-width: 2.5; fill: none; stroke-dasharray: 100; stroke-dashoffset: 100; animation: ivDrawCircle 0.5s ease forwards; }
    .iv-svg path { stroke-width: 2.5; fill: none; stroke-dasharray: 50; stroke-dashoffset: 50; animation: ivDrawPath 0.3s ease 0.3s forwards; }
    .iv-success-stroke { stroke: var(--iv-success); }
    .iv-error-stroke { stroke: var(--iv-error); }

    @keyframes ivDrawCircle { to { stroke-dashoffset: 0; } }
    @keyframes ivDrawPath { to { stroke-dashoffset: 0; } }

    /* Data Display Grid */
    .iv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      text-align: left;
      background: #f8fafc;
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--iv-border);
    }
    
    .iv-item dt {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--iv-muted);
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .iv-item dd {
      font-size: 15px;
      font-weight: 500;
      color: var(--iv-text);
      word-break: break-word;
    }

    .iv-btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--iv-text);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
      margin-top: 16px;
      transition: background 0.2s ease;
    }
    .iv-btn:hover { background: #334155; }

    /* Fluid Scaling */
    @media (max-width: 600px) {
      .iv-wrapper { padding: 16px; }
      .iv-card { padding: 36px 20px; }
      .iv-grid { grid-template-columns: 1fr; gap: 16px; padding: 20px; }
    }
  </style>
</head>

<body>

  <div class="iv-wrapper">
    
    <!-- STATE: LOADING -->
    <div id="iv-loading" class="iv-card active">
      <div class="iv-spinner"></div>
      <h2>Authenticating Record</h2>
      <p class="iv-subtitle">Establishing secure external connection...</p>
    </div>

    <!-- STATE: SUCCESS -->
    <div id="iv-success" class="iv-card">
      <svg class="iv-svg" viewBox="0 0 48 48">
        <circle class="iv-success-stroke" cx="24" cy="24" r="20" />
        <path class="iv-success-stroke" d="M14 24l7 7 14-14" />
      </svg>
      <h2>Certificate Verified</h2>
      <p class="iv-subtitle" style="color: var(--iv-success); font-weight: 500;">This digital record is authentic and valid.</p>
      <dl id="iv-details" class="iv-grid"></dl>
    </div>

    <!-- STATE: ERROR -->
    <div id="iv-error" class="iv-card">
      <svg class="iv-svg" viewBox="0 0 48 48">
        <circle class="iv-error-stroke" cx="24" cy="24" r="20" />
        <path class="iv-error-stroke" d="M16 16l16 16M32 16L16 32" />
      </svg>
      <h2 id="iv-error-title">Record Not Found</h2>
      <p class="iv-subtitle" id="iv-error-message">The certificate could not be authenticated.</p>
      <a href="mailto:support@the27links.in" class="iv-btn">Contact Support</a>
    </div>

  </div>

  <script>
    "use strict";

    const DATABASE_URL = "https://the27links.in/assets/Data/certificatesData.json";
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function fromBase64(value) {
      try {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      } catch (e) {
        throw new Error("INVALID_BASE64");
      }
    }

    async function deriveKey(passphrase, salt, iterations) {
      const material = await crypto.subtle.importKey(
        "raw", encoder.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: iterations, hash: "SHA-256" },
        material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }

    async function decryptCertificate(record, config, passphrase) {
      const salt = fromBase64(record.salt);
      const iv = fromBase64(record.iv);
      const ciphertext = fromBase64(record.ciphertext);
      const key = await deriveKey(passphrase, salt, config.iterations);
      
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv }, key, ciphertext
      );
      return JSON.parse(decoder.decode(plaintext));
    }

    function switchState(stateId) {
      document.querySelectorAll('.iv-card').forEach(el => el.classList.remove('active'));
      setTimeout(() => document.getElementById(stateId).classList.add('active'), 40);
    }

    function showError(title, msg) {
      document.getElementById("iv-error-title").textContent = title;
      document.getElementById("iv-error-message").textContent = msg;
      switchState('iv-error');
    }

    function displayData(data) {
      // Clean mapping of all your parameters
      const fields = [
        ["Full Name", data.d1], 
        ["Certificate No.", data.d2],
        ["Role / Designation", data.d3], 
        ["Time Period", data.d4],
        ["Age Group", data.d5], 
        ["Department", data.d6],
        ["Overall Performance", data.d7], 
        ["Issue Date", data.d8],
        ["Authorized By", data.d9]
      ];

      const container = document.getElementById("iv-details");
      container.innerHTML = "";

      fields.forEach(([label, value]) => {
        if (value) {
          const dt = document.createElement("dt"); dt.textContent = label;
          const dd = document.createElement("dd"); dd.textContent = value;
          const div = document.createElement("div"); div.className = "iv-item";
          div.appendChild(dt); div.appendChild(dd);
          container.appendChild(div);
        }
      });
      switchState('iv-success');
    }

    async function initializeVerification() {
      const params = new URLSearchParams(window.location.search);
      let certificateKey = params.get("certificateNo");

      if (!certificateKey || certificateKey.trim() === "") {
        return showError("Invalid Request", "No certificate number was provided in the URL.");
      }
      
      certificateKey = certificateKey.trim();

      try {
        const response = await fetch(DATABASE_URL + "?t=" + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error("FILE_NOT_FOUND");
        
        const db = await response.json();
        if (!db || !db.config || !Array.isArray(db.records)) {
          throw new Error("SCHEMA_ERROR");
        }

        let matchedRecord = null;

        for (const record of db.records) {
          try {
            const data = await decryptCertificate(record, db.config, certificateKey);
            if (String(data.d2) === certificateKey) {
              matchedRecord = data;
              break; 
            }
          } catch (e) {
            continue; 
          }
        }

        if (matchedRecord) {
          displayData(matchedRecord);
        } else {
          showError("Record Not Found", `No valid record matching ID "${certificateKey}".`);
        }

      } catch (error) {
        if (error.message === "FILE_NOT_FOUND") {
          showError("Database Missing", "The external certificatesData.json file could not be reached.");
        } else {
          showError("System Error", "An error occurred while connecting to the verification database.");
        }
      }
    }

    document.addEventListener("DOMContentLoaded", initializeVerification);
  </script>
</body>
</html>
